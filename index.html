<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="screen-orientation" content="portrait">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shorts">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube Shorts Player</title>
  
  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow for desktop view -->
  <div class="ambient-glow" id="ambient-glow"></div>

  <!-- Main vertical player frame (strictly 9:16 portrait, no auto rotate) -->
  <main class="player-shell" id="player-shell">
    <!-- Main swipe viewport containing the vertical slides track -->
    <div class="viewport" id="viewport">
      <div class="shorts-track" id="shorts-track">
        <!-- Pure video slides loaded dynamically from video.json -->
      </div>
    </div>

    <!-- Initial loading screen -->
    <div class="loader-overlay" id="initial-loader">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Main Application Script (Self-contained, no external SDK required) -->
  <script src="app.js"></script>
</body>
</html>
